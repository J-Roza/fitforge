name: fitforge
description: Fitness app for muscle training — iOS & Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Charts & progress
  fl_chart: ^0.68.0

  # Images
  cached_network_image: ^3.3.1

  # Typography
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0

  # Screen & health
  wakelock_plus: ^1.3.4

  # Sound
  audioplayers: ^6.1.0

  # Export / share
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  file_picker: ^8.1.6

  # Cloud sync (Firebase)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Utils
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  app_links: ^6.4.0
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0819"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/exercise_icons/
    - assets/exercise_photos/
    - assets/body/
    - assets/sounds/
