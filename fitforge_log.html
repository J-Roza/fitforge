<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0B1A">
<title>FitForge Log</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0D0B1A;--card:#17152B;--elev:#201D38;
  --accent:#7C68EE;--accent-dim:rgba(124,104,238,.15);
  --t1:#E8E6FF;--t2:#9B99BC;--t3:#3E3C5C;
  --bdr:rgba(255,255,255,.07);
  --green:#30D158;--gold:#FF9F0A;--red:#E8484F;
}
body.light{--bg:#F5F3FF;--card:#FFFFFF;--elev:#EDEAFC;--t1:#1A1835;--t2:#5A5872;--t3:#C0BED8;--bdr:rgba(0,0,0,.08)}
body.light .home-top,body.light .nav{background:linear-gradient(175deg,#e8e4ff 0%,var(--bg) 100%)}
body.light .stat-box{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ex-note{display:block;width:calc(100% - 28px);margin:0 14px 12px;background:var(--elev);border:1px solid var(--bdr);border-radius:10px;color:var(--t1);font-size:12px;padding:8px 12px;font-family:inherit}
.ex-note:focus{outline:none;border-color:var(--accent)}
.ex-note::placeholder{color:var(--t3)}
.h-note{font-size:12px;color:var(--t2);margin-top:5px;padding:6px 10px;background:var(--elev);border-radius:8px;font-style:italic}
.rec-1rm{font-size:11px;color:var(--t2);margin-top:2px}
.today-banner{margin:0 16px 14px;padding:14px 16px;background:var(--card);border:1px solid var(--bdr);border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tb-sub{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:3px}
.tb-name{font-size:16px;font-weight:800;line-height:1.2}
.tb-muscles{font-size:11px;color:var(--t2);margin-top:3px}
.tb-start{padding:7px 14px;border-radius:10px;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 32px}
.plan-day{background:var(--card);border:2px solid var(--bdr);border-radius:16px;padding:14px 4px 16px;text-align:center;cursor:pointer;transition:transform .12s;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;justify-content:center}
.plan-day:active{transform:scale(.92)}
.plan-day.today{border-color:var(--accent)}
.plan-day.has-s::after{content:'';position:absolute;inset:0;background:var(--pc);opacity:.08;border-radius:14px;pointer-events:none}
.plan-lbl{font-size:10px;font-weight:700;color:var(--t2);letter-spacing:.6px;position:absolute;top:8px;left:50%;transform:translateX(-50%);white-space:nowrap}
.plan-snum{font-size:22px;font-weight:800}
.plan-sname{font-size:9px;color:var(--t2);line-height:1.3;padding:0 4px}
.plan-rest{font-size:24px;opacity:.25}
.plan-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:6px;left:50%;transform:translateX(-50%)}
.plan-info{font-size:12px;color:var(--t2);padding:0 16px 16px;line-height:1.7}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--t1);font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif}
.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;background:var(--bg)}
.screen.active{display:block}
button{font-family:inherit;cursor:pointer;border:none}
select{font-family:inherit}

/* &#226;&#8226;&#144;&#226;&#8226;&#144; HOME &#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144; */
.home-top{padding:58px 20px 18px;background:linear-gradient(175deg,#1a1535 0%,var(--bg) 100%)}
.home-top h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
.home-top h1 em{font-style:normal;color:var(--accent)}
.home-date{font-size:13px;color:var(--t2);margin-top:5px}
.home-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 16px 20px}
.stat-box{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px 10px;text-align:center}
.stat-val{font-size:22px;font-weight:800;color:var(--accent)}
.stat-lbl{font-size:10px;color:var(--t2);margin-top:2px;font-weight:600;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.s-card{background:var(--card);border:1px solid var(--bdr);border-radius:22px;padding:22px 18px 20px;cursor:pointer;overflow:hidden;transition:transform .12s;position:relative}
.s-card:active{transform:scale(.96)}
.s-card::after{content:'';position:absolute;inset:0;background:var(--c);opacity:.06;pointer-events:none;border-radius:inherit}
.s-num{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--c);margin-bottom:10px}
.s-name{font-size:16px;font-weight:800;margin-bottom:4px;line-height:1.2}
.s-muscles{font-size:10px;color:var(--t2);line-height:1.5}
.s-last{font-size:10px;color:var(--t3);margin-top:12px;font-weight:600}
.home-btns{display:flex;gap:10px;margin:20px 16px 36px}
.home-btn{flex:1;padding:15px 8px;border-radius:14px;background:var(--card);border:1px solid var(--bdr);color:var(--t2);font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px}
.home-btn:active{opacity:.7}

/* &#226;&#8226;&#144;&#226;&#8226;&#144; SESSION &#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144; */
.nav{display:flex;align-items:center;gap:10px;padding:54px 16px 12px;background:linear-gradient(175deg,#16132a 0%,var(--bg) 80%);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.back{width:36px;height:36px;background:var(--elev);border-radius:12px;color:var(--t1);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-info{flex:1;min-width:0}
.nav-info .n-sub{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--c);text-transform:uppercase}
.nav-info .n-main{font-size:17px;font-weight:800;line-height:1.2}
.nav-date{font-size:12px;color:var(--t2);padding:0 16px 10px}
.ex-list{padding:0 14px 120px}

.ex-card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;margin-bottom:12px;overflow:hidden}
.ex-head{display:flex;gap:14px;align-items:center;padding:14px 14px 8px}
.ex-img{width:72px;height:72px;border-radius:14px;background:var(--ibg);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ex-img svg{width:52px;height:52px;color:var(--ic)}
.ex-body{flex:1;min-width:0}
.ex-name{font-size:15px;font-weight:800;margin-bottom:4px}
.ex-tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 9px;border-radius:20px;background:var(--ibg);color:var(--ic)}
.ex-tip{font-size:11px;color:var(--t2);margin-top:4px;line-height:1.4}
.ex-prev{display:flex;align-items:center;gap:6px;margin:0 14px 6px;padding:7px 10px;background:var(--elev);border-radius:10px;font-size:12px;color:var(--t2)}
.ex-prev .prev-ico{font-size:13px}
.ex-prev strong{color:var(--t1);font-weight:700}
.ex-prev .pr-flag{font-size:10px;font-weight:700;color:var(--gold);margin-left:4px}

.sets-row{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 8px;min-height:6px}
.chip{font-size:12px;font-weight:600;background:var(--elev);border:1px solid var(--bdr);padding:5px 10px;border-radius:10px;display:flex;align-items:center;gap:6px;animation:popIn .2s ease}
.chip .del{color:var(--t3);font-size:11px;cursor:pointer;padding:0 2px}
.chip.pr{border-color:var(--gold);color:var(--gold);background:rgba(255,159,10,.1)}
.chip.pr::before{content:'\1F3C6\20';font-size:11px}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

.ex-input{display:flex;gap:8px;padding:8px 14px 14px;border-top:1px solid var(--bdr);align-items:flex-end}
.inp-wrap{display:flex;flex-direction:column;flex:1;gap:4px}
.inp-lbl{font-size:10px;color:var(--t2);text-align:center;font-weight:600;letter-spacing:.3px}
.ex-input select{width:100%;background:var(--elev);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:var(--t1);font-size:15px;font-weight:700;padding:10px 4px;appearance:none;-webkit-appearance:none;text-align:center}
.ex-input select:focus{outline:none;border-color:var(--ic)}
.add-set{width:46px;height:46px;background:var(--accent);border-radius:12px;color:#fff;font-size:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .1s;margin-bottom:0}
.add-set:active{transform:scale(.88)}

.s4-choice{display:flex;gap:8px;padding:6px 14px 8px}
.choice-btn{flex:1;padding:8px 6px;border-radius:12px;background:var(--elev);border:2px solid var(--bdr);color:var(--t2);font-size:12px;font-weight:600;text-align:center;cursor:pointer;transition:all .15s}
.choice-btn.active{background:var(--ibg);border-color:var(--ic);color:var(--ic)}

.vol-bar{margin:0 14px;padding:8px 12px;background:rgba(124,104,238,.08);border-radius:10px;font-size:12px;color:var(--t2);display:flex;justify-content:space-between}
.vol-bar strong{color:var(--accent)}

.timer-wrap{position:fixed;bottom:0;left:0;right:0;z-index:29;pointer-events:none}
.timer-bar{background:var(--card);border-top:1px solid var(--bdr);padding:8px 14px;display:flex;align-items:center;gap:10px;pointer-events:all;transform:translateY(100%);transition:transform .3s}
.timer-bar.show{transform:translateY(0)}
.timer-track{flex:1;height:6px;background:var(--elev);border-radius:4px;overflow:hidden}
.timer-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .9s linear}
.timer-num{font-size:14px;font-weight:800;color:var(--t1);min-width:32px;text-align:center}
.timer-dur{font-size:11px;font-weight:700;color:var(--t2);background:var(--elev);border:1px solid var(--bdr);border-radius:8px;padding:3px 8px}
.timer-dur:active{opacity:.7}
.timer-close{font-size:16px;color:var(--t3);background:none;padding:4px}
.editor-chip{display:flex;align-items:center;gap:8px;background:var(--elev);border:1px solid var(--bdr);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.editor-chip .rm{background:none;color:#E8484F;font-size:16px;margin-left:auto;padding:0 2px;line-height:1;border:none;cursor:pointer}
.add-group-title{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--t2);margin:12px 0 6px;text-transform:uppercase}
.add-ex-btn{display:inline-flex;align-items:center;gap:4px;background:var(--elev);border:1px solid var(--bdr);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--t1);margin:0 6px 6px 0;cursor:pointer}
.add-ex-btn:active{opacity:.7}
.finish-bar{padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,var(--bg) 55%,transparent 100%);z-index:30}
.finish-btn{width:100%;padding:17px;border-radius:18px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:.3px;transition:transform .1s}
.finish-btn:active{transform:scale(.97)}

/* &#226;&#8226;&#144;&#226;&#8226;&#144; HISTORY &#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144; */
.hist-top{display:flex;align-items:center;gap:10px;padding:52px 16px 12px}
.hist-top h2{font-size:22px;font-weight:800;flex:1}
.export-btn{padding:8px 14px;background:var(--elev);border-radius:12px;color:var(--t2);font-size:12px;font-weight:600;border:1px solid var(--bdr)}
.export-btn:active{opacity:.7}

.tabs{display:flex;gap:4px;margin:0 16px 16px;background:var(--elev);padding:4px;border-radius:14px}
.tab{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--t2);background:none;text-align:center;transition:all .15s}
.tab.active{background:var(--card);color:var(--t1);box-shadow:0 2px 8px rgba(0,0,0,.3)}

.tab-content{display:none;padding:0 16px 40px}
.tab-content.active{display:block}

/* S&#233;ances tab */
.hist-empty{text-align:center;padding:60px 20px;color:var(--t2);font-size:14px;line-height:1.8}
.h-entry{background:var(--card);border:1px solid var(--bdr);border-radius:18px;margin-bottom:10px;overflow:hidden}
.h-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;user-select:none}
.h-left .h-date{font-size:12px;color:var(--t2);margin-bottom:2px}
.h-left .h-name{font-size:15px;font-weight:700}
.h-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.h-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.h-vol{font-size:11px;color:var(--t2)}
.h-detail{padding:0 14px 14px;display:none;border-top:1px solid var(--bdr)}
.h-detail.open{display:block}
.h-ex-block{padding:8px 0;border-bottom:1px solid var(--bdr)}
.h-ex-block:last-child{border-bottom:none}
.h-ex-name{font-size:12px;font-weight:700;color:var(--t2);margin-bottom:6px}
.h-sets-wrap{display:flex;flex-wrap:wrap;gap:5px}
.h-set-chip{font-size:12px;background:var(--elev);padding:4px 10px;border-radius:8px}
.h-set-chip.best{color:var(--gold);border:1px solid rgba(255,159,10,.3)}
.h-ex-vol{font-size:11px;color:var(--t3);margin-top:5px}
.h-del-btn{display:block;width:100%;padding:10px;margin-top:10px;background:rgba(232,72,79,.08);border-radius:12px;color:var(--red);font-size:13px;font-weight:600;border:1px solid rgba(232,72,79,.2)}

/* Records tab */
.rec-card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;margin-bottom:10px;overflow:hidden;cursor:pointer}
.rec-head{display:flex;align-items:center;gap:12px;padding:12px 14px}
.rec-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec-icon svg{width:38px;height:38px}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:14px;font-weight:700;margin-bottom:3px}
.rec-best{font-size:13px;font-weight:800;color:var(--gold)}
.rec-date{font-size:11px;color:var(--t2);margin-top:1px}
.rec-trend{display:flex;gap:5px;padding:0 14px 12px}
.trend-bar{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.trend-val{font-size:10px;font-weight:700;text-align:center}
.trend-fill{width:100%;border-radius:4px;background:var(--elev);min-height:4px;max-height:32px}
.trend-date{font-size:9px;color:var(--t3);text-align:center}
.rec-detail{display:none;padding:0 14px 14px;border-top:1px solid var(--bdr)}
.rec-detail.open{display:block}
.rec-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.rec-row:last-child{border-bottom:none}
.rec-row-date{color:var(--t2);font-size:12px}
.rec-row-sets{display:flex;gap:5px;flex-wrap:wrap}
.rec-row-best{font-weight:700;color:var(--gold)}

/* &#226;&#8226;&#144;&#226;&#8226;&#144; MODAL (Export) &#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144; */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-height:70vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:14px}
.modal textarea{width:100%;background:var(--elev);border:1px solid var(--bdr);border-radius:12px;color:var(--t1);font-size:11px;font-family:monospace;padding:12px;height:160px;resize:none}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-btn{flex:1;padding:13px;border-radius:14px;font-size:14px;font-weight:700}
.modal-btn.primary{background:var(--accent);color:#fff}
.modal-btn.ghost{background:var(--elev);color:var(--t2);border:1px solid var(--bdr)}

/* &#226;&#8226;&#144;&#226;&#8226;&#144; TOAST &#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144;&#226;&#8226;&#144; */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(16px);padding:11px 22px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;z-index:99;white-space:nowrap;transition:all .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green);color:#000;box-shadow:0 4px 16px rgba(48,209,88,.4)}
.toast.pr{background:var(--gold);color:#000;box-shadow:0 4px 16px rgba(255,159,10,.5);font-size:14px}

/* \u00e2\u2022\u0090\u00e2\u2022\u0090 HELPERS \u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090 */
function fmt(w){return w%1===0?w+'kg':w+'kg';}
function vol(sets){return sets.reduce((s,x)=>s+x.w*x.r,0);}
function best1set(sets){return sets.reduce((b,s)=>s.w>b.w||(s.w===b.w&&s.r>b.r)?s:b,{w:0,r:0});}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){
  const days=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const mo=['jan','f\u00e9v','mar','avr','mai','juin','juil','ao\u00fb','sep','oct','nov','d\u00e9c'];
  const dt=new Date(d+'T12:00:00');
  return days[dt.getDay()]+' '+dt.getDate()+' '+mo[dt.getMonth()];
}
function todayFull(){
  const d=new Date();
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const mo=['Janvier','F\u00e9vrier','Mars','Avril','Mai','Juin','Juillet','Ao\u00fbt','Septembre','Octobre','Novembre','D\u00e9cembre'];
  return days[d.getDay()]+' '+d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear();
}
function getExHistory(eid){
  return history.filter(h=>h.sets[eid]&&h.sets[eid].length>0)
    .map(h=>({date:h.date,sets:h.sets[eid],best:best1set(h.sets[eid]),volume:vol(h.sets[eid])}))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function getPR(eid){
  let pr={w:0,r:0,date:null};
  history.forEach(h=>{
    if(h.sets[eid]) h.sets[eid].forEach(s=>{
      if(s.w>pr.w||(s.w===pr.w&&s.r>pr.r)){pr={w:s.w,r:s.r,date:h.date};}
    });
  });
  return pr;
}
function isNewPR(eid,w,r){
  const pr=getPR(eid);
  return w>pr.w||(w===pr.w&&r>pr.r);
}
function totalVol(){
  return curSession.exIds.reduce((t,e)=>t+vol(curSets[e]||[]),0);
}
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type;
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>t.className='toast',type==='pr'?3200:2200);
}

function initHome(){
  document.getElementById('home-date').textContent=todayFull();
  const week=history.filter(h=>{
    const d=new Date(h.date),n=new Date();
    return (n-d)/(1000*86400)<7;
  }).length;
  const totalVolumeAll=history.reduce((t,h)=>t+Object.values(h.sets).reduce((a,s)=>a+vol(s),0),0);
  document.getElementById('home-stats').innerHTML=`
    <div class="stat-box"><div class="stat-val">${history.length}</div><div class="stat-lbl">S\u00c9ANCES</div></div>
    <div class="stat-box"><div class="stat-val">${week}</div><div class="stat-lbl">CETTE SEMAINE</div></div>
    <div class="stat-box"><div class="stat-val">${totalVolumeAll>=1000?Math.round(totalVolumeAll/1000)+'t':totalVolumeAll+'kg'}</div><div class="stat-lbl">VOLUME TOTAL</div></div>`;
  // Today's planned session banner
  const todayD=new Date().getDay();
  const todaySid=weekPlan[todayD];
  const todayBanner=document.getElementById('today-banner');
  if(todaySid){
    const ts=SESSIONS.find(x=>x.id==todaySid);
    todayBanner.style.display='flex';
    todayBanner.innerHTML='<div><div class="tb-sub">AUJOURD\'HUI</div><div class="tb-name">S'+ts.id+' &middot; '+ts.name+'</div><div class="tb-muscles">'+ts.sub+'</div></div>'
      +'<button class="tb-start" onclick="openSession('+ts.id+')">Demarrer &#8594;</button>';
  } else { todayBanner.style.display='none'; }

  document.getElementById('session-grid').innerHTML=SESSIONS.map(s=>{
    const last=history.filter(h=>h.sessionId===s.id).pop();
    const exCount=getSessionExIds(s.id).length;
    return `<div class="s-card" style="--c:${s.color};position:relative" onclick="openSession(${s.id})">
      <button onclick="event.stopPropagation();openEditor(${s.id})" style="position:absolute;top:10px;right:10px;background:var(--elev);border:1px solid var(--bdr);border-radius:8px;color:var(--t2);font-size:12px;padding:4px 8px;cursor:pointer">\u270f\ufe0f</button>
      <div class="s-num">S\u00c9ANCE ${s.id}</div>
      <div class="s-name">${s.name}</div>
      <div class="s-muscles">${s.sub}</div>
      <div class="s-last">${last?'\u00e2\u008f\u00b1 '+fmtDate(last.date):'Jamais r\u00e9alis\u00e9e'}</div>
    </div>`;
  }).join('');
}

/* \u00e2\u2022\u0090\u00e2\u2022\u0090 SESSION \u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090\u00e2\u2022\u0090 */
function openSession(id){
  curSession=SESSIONS.find(s=>s.id===id);
  const exIds=getSessionExIds(id);
  curSets={}; exIds.forEach(e=>{curSets[e]=[];});
  curNotes={};
  s4choice={rowing_choice:'bent_row'};
  const c=curSession.color;
  document.getElementById('nav-sub').textContent='S\u00c9ANCE '+curSession.id;
  document.getElementById('nav-sub').style.color=c;
  document.getElementById('nav-main').textContent=curSession.name+' \u00b7 '+curSession.sub.split(' \u00b7 ')[0];
  document.getElementById('nav-date').textContent=todayFull();
  renderExList();
  switchScreen('screen-session');
}

function renderExList(){
  const exIds=getSessionExIds(curSession.id);
  document.getElementById('ex-list').innerHTML=exIds.map(renderExCard).join('');
  updateVolDisplay();
}

function renderExCard(eid){
  const ex=EX[eid], sets=curSets[eid]||[], c=ex.color, bg=c+'22';
  const prevH=getExHistory(eid);
  const prevEntry=prevH[0];
  const pr=getPR(eid);

  let prevHtml='';
  if(prevEntry){
    const pb=best1set(prevEntry.sets);
    prevHtml=`<div class="ex-prev"><span class="prev-ico">\uD83D\uDCCB</span>
      <span>Derni\u00e8re fois (${fmtDate(prevEntry.date)}) : <strong>${fmt(pb.w)} \u00d7 ${pb.r}</strong></span>
      ${pr.w>0?`<span class="pr-flag">\uD83C\uDFC6 PR: ${fmt(pr.w)}\u00d7${pr.r}</span>`:''}
    </div>`;
  }

  let choiceHtml='';
  if(eid==='rowing_choice'){
    const ch=s4choice.rowing_choice;
    choiceHtml=`<div class="s4-choice">
      <button class="choice-btn${ch==='bent_row'?' active':''}" onclick="setRowingChoice('bent_row')" style="--ic:${c};--ibg:${bg}">Buste pench\u00e9</button>
      <button class="choice-btn${ch==='one_arm_row'?' active':''}" onclick="setRowingChoice('one_arm_row')" style="--ic:${c};--ibg:${bg}">1 bras halt\u00e8re</button>
    </div>`;
  }

  const bestI=sets.length?sets.reduce((bi,s,i)=>s.w*s.r>sets[bi].w*sets[bi].r?i:bi,0):-1;
  const chips=sets.map((s,i)=>`<div class="chip${i===bestI&&sets.length>1?' pr':''}" ${i===bestI&&sets.length>1?`style="--ic:${c}"`:''}>${fmt(s.w)} \u00d7 ${s.r}<span class="del" onclick="delSet('${eid}',${i})">&#10005;</span></div>`).join('');

  const defW=lastWeights[eid]||20;
  const wOpts=WEIGHTS.map(w=>`<option${w==defW?' selected':''}>${w}</option>`).join('');
  const rOpts=REPS.map(r=>`<option${r==10?' selected':''}>${r}</option>`).join('');

  return `<div class="ex-card" id="card-${eid}" style="--ic:${c};--ibg:${bg}">
    <div class="ex-head">
      <div class="ex-img">${ex.svg}</div>
      <div class="ex-body">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-tag">${ex.muscle}</div>
        <div class="ex-tip">${ex.tip}</div>
      </div>
    </div>
    ${prevHtml}${choiceHtml}
    <div class="sets-row" id="sets-${eid}">${chips}</div>
    <input type="text" class="ex-note" id="note-${eid}" placeholder="Note..." oninput="curNotes['${eid}']=this.value" value="${curNotes[eid]||''}">
    <div class="ex-input">
      <div class="inp-wrap"><div class="inp-lbl">POIDS</div><select id="w-${eid}">${wOpts}</select></div>
      <div class="inp-wrap"><div class="inp-lbl">REPS</div><select id="r-${eid}">${rOpts}</select></div>
      <button class="add-set" onclick="addSet('${eid}')">+</button>
    </div>
  </div>`;
}

function addSet(eid){
  const w=parseFloat(document.getElementById('w-'+eid).value);
  const r=parseInt(document.getElementById('r-'+eid).value);
  const newPR=isNewPR(eid,w,r);
  curSets[eid].push({w,r});
  lastWeights[eid]=w;
  const sets=curSets[eid], c=EX[eid].color;
  const bestI=sets.reduce((bi,s,i)=>s.w*s.r>sets[bi].w*sets[bi].r?i:bi,0);
  document.getElementById('sets-'+eid).innerHTML=sets.map((s,i)=>
    `<div class="chip${i===bestI&&sets.length>1?' pr':''}">${fmt(s.w)} \u00d7 ${s.r}<span class="del" onclick="delSet('${eid}',${i})">&#10005;</span></div>`
  ).join('');
  updateVolDisplay();
  if(newPR) showToast('\uD83C\uDFC6 NOUVEAU RECORD ! '+fmt(w)+' \u00d7 '+r,'pr');
  else showToast('S\u00e9rie ajout\u00e9e &#10003;','ok');
  startTimer();
}

function delSet(eid,idx){
  curSets[eid].splice(idx,1);
  const sets=curSets[eid];
  const bestI=sets.length?sets.reduce((bi,s,i)=>s.w*s.r>sets[bi].w*sets[bi].r?i:bi,0):-1;
  document.getElementById('sets-'+eid).innerHTML=sets.map((s,i)=>
    `<div class="chip${i===bestI&&sets.length>1?' pr':''}">${fmt(s.w)} \u00d7 ${s.r}<span class="del" onclick="delSet('${eid}',${i})">&#10005;</span></div>`
  ).join('');
  updateVolDisplay();
}

function updateVolDisplay(){
  const v=totalVol();
  document.getElementById('nav-vol').textContent=v>0?v+'kg total':'';
}

function setRowingChoice(ch){
  s4choice.rowing_choice=ch;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.classList.toggle('active',b.textContent.includes(ch==='bent_row'?'pench\u00e9':'bras'));
  });
}

function confirmBack(){
  const hasSets=curSession.exIds.some(e=>(curSets[e]||[]).length>0);
  if(!hasSets){showHome();return;}
  if(confirm('Quitter sans sauvegarder ?')) showHome();
}

function finishSession(){
  stopTimer();
  const nonEmpty=getSessionExIds(curSession.id).filter(e=>(curSets[e]||[]).length>0);
  if(!nonEmpty.length){showToast('Ajoute au moins 1 s\u00e9rie !','warn');return;}
  const entry={
    id:Date.now(),
    date:today(),
    sessionId:curSession.id,
    sessionName:curSession.name,
    sets:{}
  };
  nonEmpty.forEach(e=>{entry.sets[e]=curSets[e];});
  entry.notes={};
  Object.keys(curNotes).forEach(e=>{if(curNotes[e])entry.notes[e]=curNotes[e];});
  history.push(entry);
  save();
  showToast('S\u00e9ance sauvegard\u00e9e \uD83C\uDFC6','pr');
  setTimeout(()=>showHome(),700);
}

function renderSeances(){
  const el=document.getElementById('tc-seances');
  if(!history.length){
    el.innerHTML=`<div class="hist-empty">Aucune s\u00e9ance enregistr\u00e9e encore.<br><br>Lance-toi ! \uD83D\uDCAA</div>`;
    return;
  }
  el.innerHTML=[...history].reverse().map((h,ri)=>{
    const idx=history.length-1-ri;
    const s=SESSIONS.find(x=>x.id===h.sessionId);
    const color=s?s.color:'#7C68EE';
    const totalV=Object.values(h.sets).reduce((t,s)=>t+vol(s),0);
    const nEx=Object.keys(h.sets).length;
    const totalSets=Object.values(h.sets).reduce((t,s)=>t+s.length,0);

    const detail=Object.entries(h.sets).map(([eid,sets])=>{
      const ex=EX[eid];
      const bestI=sets.length?sets.reduce((bi,s,i)=>s.w*s.r>sets[bi].w*sets[bi].r?i:bi,0):-1;
      const chips=sets.map((s,i)=>`<span class="h-set-chip${i===bestI&&sets.length>1?' best':''}">${fmt(s.w)}\u00d7${s.r}</span>`).join('');

function renderRecords(){
  const el=document.getElementById('tc-records');
  const allEx=Object.keys(EX);
  const withHistory=allEx.filter(eid=>getExHistory(eid).length>0);
  if(!withHistory.length){
    el.innerHTML=`<div class="hist-empty">Aucun record encore.<br>Compl\u00e8te ta premi\u00e8re s\u00e9ance ! \uD83D\uDCAA</div>`;
    return;
  }
  el.innerHTML=withHistory.map(eid=>{
    const ex=EX[eid], c=ex.color, bg=c+'22';
    const hist=getExHistory(eid); // most recent first
    const pr=getPR(eid);
    const recent=hist.slice(0,5).reverse(); // oldest to newest for chart
    const maxW=recent.reduce((m,h)=>Math.max(m,h.best.w),0);

    const bars=recent.map(h=>{
      const pct=maxW>0?Math.round((h.best.w/maxW)*32):4;
      return `<div class="trend-bar">
        <div class="trend-val" style="color:${c}">${fmt(h.best.w)}</div>
        <div class="trend-fill" style="height:${pct}px;background:${c}66"></div>
        <div class="trend-date">${fmtDate(h.date).slice(0,6)}</div>
      </div>`;
    }).join('');

    const rows=hist.map(h=>{
      const bestS=best1set(h.sets);
      const chips=h.sets.map(s=>`<span class="h-set-chip">${fmt(s.w)}\u00d7${s.r}</span>`).join('');
      return `<div class="rec-row">
        <span class="rec-row-date">${fmtDate(h.date)}</span>
        <div class="rec-row-sets">${chips}</div>
      </div>`;
    }).join('');

    return `<div class="rec-card">
      <div class="rec-head" onclick="this.parentElement.querySelector('.rec-detail').classList.toggle('open')">
        <div class="rec-icon" style="background:${bg};color:${c}">${ex.svg}</div>
        <div class="rec-info">
          <div class="rec-name">${ex.name}</div>
          <div class="rec-best">\uD83C\uDFC6 ${fmt(pr.w)} \u00d7 ${pr.r} rep</div>
          <div class="rec-date">Record le ${fmtDate(pr.date)} \u00b7 ${hist.length} s\u00e9ance${hist.length>1?'s':''}</div>
        </div>
      </div>
      ${recent.length>1?`<div class="rec-trend">${bars}</div>`:''}
      <div class="rec-detail">
        <div style="font-size:12px;font-weight:700;color:var(--t2);padding:10px 0 6px">TOUTES LES S\u00c9ANCES</div>
        ${rows}
      </div>
    </div>`;
  }).join('');
}

function delHistory(idx){

function renderEditorLists(sid,current){
  document.getElementById('editor-current').innerHTML=current.map(eid=>{
    const ex=EX[eid];
    return `<div class="editor-chip"><span style="font-size:12px;font-weight:700;flex:1">${ex.name}</span><span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${ex.color}22;color:${ex.color}">${ex.muscle}</span>${current.length>1?`<button class="rm" onclick="removeFromEditor(${sid},'${eid}')">&times;</button>`:''}</div>`;
  }).join('');
  let h='';
  Object.entries(EX_BY_MUSCLE).forEach(([m,ids])=>{
    const avail=ids.filter(e=>!current.includes(e));
    if(!avail.length) return;
    h+=`<div class="add-group-title">${m}</div>`;
    h+=avail.map(e=>`<button class="add-ex-btn" onclick="addToEditor(${sid},'${e}')">+ ${EX[e].name}</button>`).join('');
  });
  document.getElementById('editor-add').innerHTML=h||'<p style="font-size:12px;color:var(--t2)">Tous les exercices sont deja dans la seance.</p>';
}
function addToEditor(sid,eid){
  const c=[...getSessionExIds(sid),eid];
  customSessions[sid]=c; save(); renderEditorLists(sid,c); initHome();
}
function removeFromEditor(sid,eid){
  const c=getSessionExIds(sid).filter(e=>e!==eid);
  customSessions[sid]=c; save(); renderEditorLists(sid,c); initHome();
}
function resetSession(sid){
  delete customSessions[sid]; save();
  renderEditorLists(sid,SESSIONS.find(s=>s.id===sid).exIds); initHome();
}/* == REST TIMER ============================================ */
function startTimer(){
  stopTimer();
  timerTotal=TIMER_DURATIONS[timerDurIdx];
  timerRemaining=timerTotal;
  updateTimerUI();
  document.getElementById('timer-bar').classList.add('show');
  timerInterval=setInterval(()=>{
    timerRemaining--;
    if(timerRemaining<=0){stopTimer();beep();showToast('Repos fini - Go !','ok');return;}
    updateTimerUI();
  },1000);
}
function stopTimer(){
  clearInterval(timerInterval);timerInterval=null;
  const bar=document.getElementById('timer-bar');
  if(bar) bar.classList.remove('show');
}
function updateTimerUI(){
  const m=Math.floor(timerRemaining/60),s=timerRemaining%60;
  document.getElementById('timer-num').textContent=m+':'+(s<10?'0':'')+s;
  document.getElementById('timer-fill').style.width=(timerRemaining/timerTotal*100)+'%';
}
function cycleTimerDur(){
  timerDurIdx=(timerDurIdx+1)%TIMER_DURATIONS.length;
  localStorage.setItem('ff_tdur',timerDurIdx);
  document.getElementById('timer-dur-btn').textContent=TIMER_DURATIONS[timerDurIdx]+'s';
  if(timerInterval) startTimer();
}
function beep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [880,1100].forEach((freq,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;
      g.gain.setValueAtTime(0.25,ctx.currentTime+i*0.18);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.18+0.3);
      o.start(ctx.currentTime+i*0.18);o.stop(ctx.currentTime+i*0.18+0.35);
    });
  }catch(e){}
}
/* == THEME TOGGLE ============================================= */
function toggleTheme(){
  isDark=!isDark;
  applyTheme();
  localStorage.setItem('ff_theme',isDark?'dark':'light');
}
function applyTheme(){
  document.body.classList.toggle('light',!isDark);
  const btn=document.getElementById('theme-btn');
  if(btn) btn.textContent=isDark?'Mode clair':'Mode sombre';
}

/* == 1RM (Epley formula) ======================================= */
function epley(w,r){ return r<=1?w:Math.round(w*(1+r/30)); }

/* == WEEKLY PLANNING ========================================== */
const DAY_NAMES=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
function showPlanning(){
  renderPlanning();
  switchScreen('screen-planning');
}
function renderPlanning(){
  const days=[1,2,3,4,5,6,0];
  const todayD=new Date().getDay();
  document.getElementById('plan-grid').innerHTML=days.map(d=>{
    const sid=weekPlan[d];
    const s=sid?SESSIONS.find(x=>x.id==sid):null;
    const isToday=todayD===d;
    return '<div class="plan-day'+(sid?' has-s':'')+(isToday?' today':'')+'"'
      +(s?' style="--pc:'+s.color+'"':'')+' onclick="cyclePlanDay('+d+')">'
      +'<div class="plan-lbl">'+DAY_NAMES[d]+'</div>'
      +(s?'<div class="plan-snum" style="color:'+s.color+'">S'+sid+'</div>'
          +'<div class="plan-sname">'+s.name+'</div>'
        :'<div class="plan-rest">&#8212;</div>')
      +(isToday?'<div class="plan-dot"></div>':'')
      +'</div>';
  }).join('');
}
function cyclePlanDay(d){
  const cur=weekPlan[d]||0;
  const next=cur>=4?null:(cur||0)+1;
  if(next===null) delete weekPlan[d]; else weekPlan[d]=next;
  save(); renderPlanning(); initHome();
}
function showHome(){initHome();switchScreen('screen-home');}
function switchScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById(id);
  el.classList.add('active');
  el.scrollTop=0;
}
