<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- dumbbell behind head -->
  <rect fill="#fff" x="14" y="20" width="10" height="13" rx="3"/>
  <rect fill="#fff" x="24" y="23" width="9" height="7" rx="2"/>
  <!-- arms extended back overhead -->
  <rect fill="#fff" x="30" y="28" width="22" height="6.5" rx="3.2" transform="rotate(20 41 31)"/>
  <!-- head -->
  <circle fill="#fff" cx="54" cy="40" r="7.5"/>
  <!-- torso lying horizontal -->
  <rect fill="#fff" x="50" y="44" width="34" height="11" rx="5.5"/>
  <!-- legs bent -->
  <rect fill="#fff" x="78" y="46" width="8" height="14" rx="4"/>
  <!-- bench -->
  <rect fill="#fff" x="40" y="60" width="50" height="7" rx="3"/>
  <rect fill="#fff" x="44" y="67" width="5" height="13" rx="2"/>
  <rect fill="#fff" x="80" y="67" width="5" height="13" rx="2"/>
</svg>
