<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- dumbbells held wide above -->
  <rect fill="#fff" x="16" y="22" width="13" height="9" rx="3"/>
  <rect fill="#fff" x="71" y="22" width="13" height="9" rx="3"/>
  <!-- arms open arc -->
  <rect fill="#fff" x="26" y="30" width="6.5" height="22" rx="3.2" transform="rotate(28 29 41)"/>
  <rect fill="#fff" x="68" y="30" width="6.5" height="22" rx="3.2" transform="rotate(-28 71 41)"/>
  <!-- head -->
  <circle fill="#fff" cx="50" cy="50" r="7.5"/>
  <!-- torso lying (vertical, head up) -->
  <rect fill="#fff" x="42" y="56" width="16" height="22" rx="7"/>
  <!-- legs -->
  <rect fill="#fff" x="43" y="78" width="6" height="10" rx="3"/>
  <rect fill="#fff" x="51" y="78" width="6" height="10" rx="3"/>
</svg>
