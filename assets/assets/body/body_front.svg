  <line x1="50" y1="68" x2="50" y2="136" stroke="#0A0819" stroke-width="1.5" opacity="0.4"/>
  <line x1="34" y1="84" x2="66" y2="84" stroke="#0A0819" stroke-width="1" opacity="0.4"/>
  <line x1="33" y1="100" x2="67" y2="100" stroke="#0A0819" stroke-width="1" opacity="0.4"/>
  <line x1="34" y1="116" x2="66" y2="116" stroke="#0A0819" stroke-width="1" opacity="0.4"/>

